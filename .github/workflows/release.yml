name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtk-3-dev libayatana-appindicator3-dev libglib2.0-dev-bin libxkbcommon-dev

      - name: Configure CMake
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.tag_name }}"
          fi
          CLEAN_VER="${VERSION#v}"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSENKEY_VERSION="$CLEAN_VER"

      - name: Build SenKey and SenKey GUI
        run: cmake --build build -j$(nproc)

      - name: Run verification tests
        run: ctest --test-dir build --output-on-failure

      - name: Prepare release archive
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ inputs.tag_name }}"
          fi
          PKG_NAME="senkey-${VERSION}-linux-amd64"
          mkdir -p "$PKG_NAME/icons"

          cp build/senkey "$PKG_NAME/"
          cp build/senkey-gui "$PKG_NAME/"
          cp install.sh "$PKG_NAME/"
          cp README.md "$PKG_NAME/"
          cp COPYING "$PKG_NAME/"
          cp NOTICE "$PKG_NAME/"
          cp -r icons/*.png "$PKG_NAME/icons/"

          tar -czvf "senkey-linux-amd64.tar.gz" -C "$PKG_NAME" .
          tar -czvf "${PKG_NAME}.tar.gz" "$PKG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: SenKey ${{ github.ref_name || inputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            senkey-linux-amd64.tar.gz
            senkey-*-linux-amd64.tar.gz
